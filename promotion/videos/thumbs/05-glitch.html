<!doctype html><html lang="en"><head><meta charset="utf-8"><style>

* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1280px; height: 720px; overflow: hidden; }
.t { position: relative; width: 1280px; height: 720px; overflow: hidden; background: #000; font-family: "Geist", sans-serif; color: #fff; }

.sub span { background: #000; padding: 0 .12em; }
.badge { position: absolute; left: 64px; bottom: 64px; padding: 14px 26px; border-radius: 999px; background: #fff; color: #000;

.card img { width: 100%; height: 100%; object-fit: cover; border-radius: 8px; }
.card b { position: absolute; right: -16px; top: -16px; padding: 8px 18px; border-radius: 999px; font-size: 26px; font-weight: 800; }
.c1 { left: 800px; top: 150px; transform: rotate(-7deg); } .c1 b { background: #6d3be8; color: #fff; }
